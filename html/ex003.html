<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex003</title>
</head>

<body>
    <script>
        var n1 = Number.parseFloat(window.prompt('Digite um numero'))

        var n2 = Number.parseFloat(window.prompt('Digite um segundo numero'))

        var soma = n1 + n2
        var soma = soma.toString()

        window.alert(`A soma dos valores eh: ${soma}`)

        window.alert(`O tipo da var "soma" eh: ${typeof soma}`)
    </script>
</body>

</html>
